services:
  app:
    restart: unless-stopped
    tty: true
    build:
      context: ./docker/app
    env_file:
      - ./app/.env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/app
      - ./docker/app/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - backend
  nginx:
    restart: unless-stopped
    tty: true
    ports:
      - "127.0.0.1:8080:80"
      - "[::1]:8080:80"
    build:
      context: ./docker/nginx
    volumes:
      - .:/app
    depends_on:
      - app
      - mailpit
    networks:
      - frontend
      - backend
  vue-frontend:
    restart: unless-stopped
    tty: true
    build:
      context: .
      dockerfile: ./docker/vue/Dockerfile
    env_file:
      - ./app/.env
    ports:
      - "127.0.0.1:5173:5173"
      - "[::1]:5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - frontend
  mysql:
    restart: unless-stopped
    tty: true
    build:
      context: ./docker/mysql
    env_file:
      - ./app/.env
    ports:
      - "127.0.0.1:8503:3306"
      - "[::1]:8503:3306"
    volumes:
      - userfrosting-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=tcp --host=127.0.0.1 --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - backend
  mailpit:
    image: 'axllent/mailpit:latest'
    ports:
      - '127.0.0.1:1025:1025'
      - '[::1]:1025:1025'
      - '127.0.0.1:8025:8025'
      - '[::1]:8025:8025'
    networks:
      - backend
volumes:
  userfrosting-db:
    driver: local
networks:
  frontend:
  backend:
    driver: bridge
