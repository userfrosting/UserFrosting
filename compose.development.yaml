# Development-only Docker Compose configuration.
include:
  - ./docker/compose.development.app.yaml
  - ./docker/compose.development.nginx.yaml
  - ./docker/compose.development.vue-frontend.yaml
  - ./docker/compose.development.mysql.yaml
  - ./docker/compose.development.mariadb.yaml
  - ./docker/compose.development.pgsql.yaml
  - ./docker/compose.development.mysql-test.yaml
  - ./docker/compose.development.mariadb-test.yaml
  - ./docker/compose.development.pgsql-test.yaml
  - ./docker/compose.development.memcached.yaml
  - ./docker/compose.development.redis.yaml
  - ./docker/compose.development.mailpit.yaml
volumes:
  node-modules:
    driver: local
  userfrosting-db:
    driver: local
  userfrosting-mariadb:
    driver: local
  userfrosting-pgsql:
    driver: local
networks:
  frontend:
  backend:
    driver: bridge
