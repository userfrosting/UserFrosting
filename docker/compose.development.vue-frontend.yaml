services:
  vue-frontend:
    restart: unless-stopped
    tty: true
    build:
      context: ..
      dockerfile: docker/vue/Dockerfile
      args:
        NODE_UID: ${DOCKER_UID:-1000}
        NODE_GID: ${DOCKER_GID:-1000}
    ports:
      - "127.0.0.1:${DOCKER_VITE_PORT:-5173}:5173"
      - "[::1]:${DOCKER_VITE_PORT:-5173}:5173"
    volumes:
      - ..:/app
      - node-modules:/app/node_modules
    networks:
      - frontend
